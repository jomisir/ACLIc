# /etc/nginx/sites-available/aclic.org — reverse proxy in front of the
# Next.js standalone server (PM2/systemd, listening on 127.0.0.1:3000).
# Replace aclic.org with the purchased domain everywhere below.

server {
    listen 80;
    listen [::]:80;
    server_name aclic.org www.aclic.org;

    # certbot uses this for the HTTP-01 challenge before TLS is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aclic.org www.aclic.org;

    ssl_certificate     /etc/letsencrypt/live/aclic.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aclic.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m; # matches the resource-upload cap in the app

    # Never let /admin get indexed, even if the app's own header is bypassed.
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static build output and public/ assets — served directly by nginx,
    # bypassing Node, with long-lived caching (filenames are content-hashed).
    location /_next/static/ {
        alias /opt/aclic/app/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.ico {
        alias /opt/aclic/app/public/favicon.ico;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
