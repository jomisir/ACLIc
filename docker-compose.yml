services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy

  # Optional: run Postgres on the VPS instead of Supabase-hosted Postgres.
  # If you use Supabase for the database too, remove this service and point
  # DATABASE_URL in .env.production at it directly.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aclic}
      POSTGRES_USER: ${POSTGRES_USER:-aclic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - aclic-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aclic}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aclic-db-data:
